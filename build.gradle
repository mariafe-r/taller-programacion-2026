plugins {
    id 'java'
    id 'application'
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.9.2'
    testImplementation 'org.junit.jupiter:junit-jupiter-params:5.9.2'
    testImplementation 'org.assertj:assertj-core:3.24.2'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.9.2'
}

application {
    mainClass = 'com.umb.taller.Main' // Demo de consola (flujo fijo)
}

tasks.named('test') {
    useJUnitPlatform()
}

// Menú interactivo de consola: ./gradlew runConsole
tasks.register('runConsole', JavaExec) {
    group = 'application'
    description = 'Ejecuta el menú interactivo de consola de la biblioteca'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.umb.taller.console.ConsoleMenu'
    standardInput = System.in
}

// Interfaz gráfica Swing: ./gradlew runGui
tasks.register('runGui', JavaExec) {
    group = 'application'
    description = 'Ejecuta la interfaz gráfica (Swing) de la biblioteca'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.umb.taller.gui.LibraryGUI'
}